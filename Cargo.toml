[package]
name = "igrisecosystem"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "v5", "serde"] }
bytes = "1.5"
sha2 = "0.10"
once_cell = "1.19"
dirs = "5.0"
axum = "0.7"
reqwest = { version = "0.11", features = ["stream", "json", "blocking"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "add-extension"] }
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rcgen = "0.13"
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["sync"] }
local-ip-address = "0.6"
whoami = "1.5"
mime_guess = "2.0"
rand = "0.8"
lazy_static = "1.4"

# Voice assistant / GUI
dioxus = { version = "0.7", features = ["desktop"] }
dioxus-desktop = "0.7"
sherpa-onnx = "1.11"
cpal = "0.16"
rodio = "0.17"
regex = "1.10"
urlencoding = "2.1"
image = { version = "0.24", features = ["jpeg", "png"] }
num_cpus = "1.16"
indicatif = "0.17"
console = { version = "0.16", features = ["std"] }
zip = "0.6"
rfd = "0.15"
async-std = "1.12"
fuzzy-matcher = "0.3"
num-complex = "0.4"
rustfft = "6.1"
scraper = "0.20"
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
prost-types = "0.13"
dotenv = "0.15"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["processthreadsapi", "winnt", "winuser", "winsock2", "ws2def", "handleapi", "processenv", "fileapi", "winbase"] }
windows = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Notifications",
    "Win32_Media",
    "Win32_System_Power",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
hmac = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"

[build-dependencies]
embed-resource = "1.8"
tonic-build = "0.12"
protoc-bin-vendored = "3.0"

[lib]
name = "igrisecosystem"
path = "src/lib.rs"

[[bin]]
name = "igrisecosystem"
path = "src/main.rs"

[features]
default = []
with_riva = []
