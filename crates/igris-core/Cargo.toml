[package]
name = "igris-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "IGRIS Ecosystem Phase 1 foundation: errors, config, types, events, runtime, logging (no eco/fastswap/voice/nlu/reflex logic yet)"
publish = false

[lib]
name = "igris_core"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.6", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
